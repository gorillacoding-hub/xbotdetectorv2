# Author: gorcoding
# Optional: builds the debug APK in GitHub's cloud (free), so no PC is needed. Upload this project to a GitHub repo
# from your phone, open Actions > "Build APK" > Run workflow, then download the artifact.
name: Build APK
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle -p android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: xbotscope-browser-debug, path: android/app/build/outputs/apk/debug/*.apk }
